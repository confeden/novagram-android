## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7031
APP_VERSION_NAME=12.10.0
APP_PACKAGE=com.brent.novagram
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=brent_novagram_release
RELEASE_STORE_PASSWORD=android
RELEASE_STORE_FILE=../../../keys/brent-novagram-release.jks
# NovaGram: tuned for the build machine (8 cores, 32 GB). The heap was 3 GB,
# which put R8 and dexing into constant garbage collection; the worker count was
# 4, which left half the cores idle during javac and the resource merge.
org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024M -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=6
org.gradle.priority=low
org.gradle.configureondemand=false
# The build cache turns a repeated task with the same inputs into a copy out of
# the cache. It is what makes switching branches, or rebuilding after a revert,
# cost seconds instead of minutes - the incremental build alone cannot do that,
# because it only knows the previous state, not every state seen before.
org.gradle.caching=true
# Gradle watches the file system instead of scanning it at the start of every
# build. On a tree this size the scan is the first several seconds of every run.
org.gradle.vfs.watch=true
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true
